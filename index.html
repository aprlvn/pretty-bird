<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pretty Bird</title>
<link rel="icon" type="image/png" href="images/favicon.png?v=2">
<link rel="apple-touch-icon" href="images/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="overlay">
      <h1 id="title">Pretty Bird</h1>
      <p id="message">Tap, click, or press Space to flap</p>
      <p id="score-display"></p>
      <button id="start-btn">Play</button>
    </div>
    <div id="hud">
      <span id="score">0</span>
    </div>
    <div id="audio-controls">
      <button id="mute-btn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
      <input type="range" id="music-volume" min="0" max="100" value="45" step="1" aria-label="Music volume">
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
